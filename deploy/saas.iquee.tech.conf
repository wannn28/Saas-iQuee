# Gapless SaaS landing demo - saas.iquee.tech (Cloudflare proxied CNAME -> iquee.tech) (added 2026-09-29; 443 added 2026-09-29)
# Static SPA built from /workspace/demo-saas. NOT a default_server.
server {
    listen 80;
    listen [::]:80;
    server_name saas.iquee.tech;

    root /var/www/iquee-saas;
    index index.html;
    access_log /var/log/nginx/saas.iquee.tech.access.log;
    error_log  /var/log/nginx/saas.iquee.tech.error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml font/ttf font/otf application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    # Gapless waitlist Node.js API (docker compose, loopback only) - added 2026-09-29
    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        client_max_body_size 64k;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name saas.iquee.tech;

    ssl_certificate     /etc/letsencrypt/live/saas.iquee.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saas.iquee.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

