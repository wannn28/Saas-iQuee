# Gapless waitlist - API + MySQL 8
# Usage: cp .env.example .env (fill in secrets) && docker compose up -d --build
# MySQL is NOT published on the host; the API is published on 127.0.0.1 only (Nginx proxies /api/).
name: iquee-saas

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --max-connections=50
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gapless}
      MYSQL_USER: ${MYSQL_USER:-gapless}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 512m
    networks: [internal]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build: ./server
    image: iquee-saas-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: mysql://${MYSQL_USER:-gapless}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-gapless}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://saas.iquee.tech}
      TRUST_PROXY: ${TRUST_PROXY:-2}
      ADMIN_USER: ${ADMIN_USER:-demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      IP_HASH_SALT: ${IP_HASH_SALT:?set IP_HASH_SALT in .env}
      SIGNUP_RATE_LIMIT: ${SIGNUP_RATE_LIMIT:-10}
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "127.0.0.1:${API_PORT:-3005}:3005"
    mem_limit: 192m
    networks: [internal]
    logging: *logging

volumes:
  mysqldata:

networks:
  internal:
